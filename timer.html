<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Таймер</title>
<style>
:root{--bg:#0b1220;--panel:#121a2c;--line:#243049;--text:#eaf0f8;--mute:#8b98b0;--accent:#4da3ff;--done:#ff5d5d}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:radial-gradient(ellipse at 50% 0%,#14213d 0%,var(--bg) 60%);color:var(--text);font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:24px 16px;min-height:100vh}
header{width:100%;max-width:1100px;display:flex;justify-content:space-between;align-items:center;gap:16px}
.wsk{height:clamp(70px,12vw,120px);width:auto}
.cs{width:clamp(48px,7vw,72px);height:auto}
main{display:flex;flex-direction:column;align-items:center;gap:clamp(20px,4vh,40px);width:100%}
#time{font-family:"Bahnschrift","DIN Alternate","Segoe UI",Roboto,sans-serif;font-weight:600;font-variant-numeric:tabular-nums;font-size:clamp(72px,22vw,340px);line-height:1;letter-spacing:.02em;text-align:center;transition:color .3s}
#time.done{color:var(--done);animation:blink .8s steps(2) infinite}
@keyframes blink{50%{opacity:.25}}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
button{font:inherit;font-size:clamp(16px,2.2vw,22px);color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 28px;cursor:pointer;transition:background .15s,border-color .15s,transform .1s}
button:hover{border-color:var(--accent)}
button:active{transform:scale(.97)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
button.on{background:#17325a;border-color:var(--accent)}
#go{background:var(--accent);border-color:var(--accent);color:#06101f;font-weight:700;min-width:170px}
#go:hover{background:#78b9ff}
.ad{color:var(--mute);font-size:14px;font-style:italic;text-align:center;border:1px dashed var(--line);border-radius:10px;padding:8px 18px;margin-bottom:8px}
dialog{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:18px;padding:24px;width:min(92vw,380px);margin:auto}
dialog::backdrop{background:rgba(3,7,15,.7)}
dialog h2{font-size:20px;font-weight:600;margin-bottom:16px}
.fields{display:flex;gap:10px;margin-bottom:16px}
.fields label{flex:1;font-size:13px;color:var(--mute);display:flex;flex-direction:column;gap:6px}
.fields input{font:inherit;font-size:22px;width:100%;text-align:center;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 4px}
.fields input:focus-visible{outline:2px solid var(--accent)}
.chk{display:flex;align-items:center;gap:10px;margin-bottom:20px;font-size:16px}
.chk input{width:20px;height:20px;accent-color:var(--accent)}
.dlg-btns{display:flex;gap:10px;justify-content:flex-end}
.dlg-btns button{font-size:16px;padding:10px 20px}
@media(prefers-reduced-motion:reduce){#time.done{animation:none}}
</style>
</head>

<main>
  <div id="time" aria-live="off">15:00</div>
  <div class="row" id="presets">
    <button data-s="900" class="on">15 мин</button>
    <button data-s="6300">1:45 часа</button>
  </div>
  <div class="row">
    <button id="go">Старт</button>
    <button id="reset">Сброс</button>
    <button id="cfg" aria-label="Настройки">⚙ Настройки</button>
  </div>
</main>


<dialog id="dlg">
  <h2>Настройки</h2>
  <div class="fields">
    <label>Часы<input id="fh" type="number" min="0" max="99" value="0" inputmode="numeric"></label>
    <label>Минуты<input id="fm" type="number" min="0" max="59" value="15" inputmode="numeric"></label>
    <label>Секунды<input id="fs" type="number" min="0" max="59" value="0" inputmode="numeric"></label>
  </div>
  <label class="chk"><input id="snd" type="checkbox" checked> Звук в конце</label>
  <div class="dlg-btns">
    <button id="cancel">Закрыть</button>
    <button id="apply" class="on">Применить</button>
  </div>
</dialog>

<script>
(function(){
  var timeEl=document.getElementById('time'),go=document.getElementById('go'),
      presets=document.getElementById('presets'),total=900,left=900,end=0,tid=null,soundOn=true;
  function pad(n){return n<10?'0'+n:''+n}
  function fmt(s){
    var h=Math.floor(s/3600),m=Math.floor(s%3600/60),c=s%60;
    return (total>=3600?h+':':'')+pad(m)+':'+pad(c);
  }
  function show(){timeEl.textContent=fmt(left);document.title=(tid?fmt(left)+' · ':'')+'Таймер'}
  function beep(){
    if(!soundOn)return;
    try{
      var a=new (window.AudioContext||window.webkitAudioContext)(),t=a.currentTime;
      for(var i=0;i<4;i++){
        var o=a.createOscillator(),g=a.createGain();
        o.frequency.value=880;o.connect(g);g.connect(a.destination);
        g.gain.setValueAtTime(.3,t+i*.4);g.gain.setValueAtTime(0,t+i*.4+.25);
        o.start(t+i*.4);o.stop(t+i*.4+.3);
      }
    }catch(e){}
  }
  function tick(){
    var r=Math.max(0,Math.ceil((end-Date.now())/1000));
    if(r!==left){left=r;show()}
    if(r<=0){stop();timeEl.classList.add('done');go.textContent='Старт';beep()}
  }
  function start(){
    if(left<=0)reset();
    timeEl.classList.remove('done');
    end=Date.now()+left*1000;tid=setInterval(tick,200);go.textContent='Пауза';show();
  }
  function stop(){clearInterval(tid);tid=null;go.textContent='Старт';show()}
  function reset(){stop();left=total;timeEl.classList.remove('done');show()}
  go.onclick=function(){tid?stop():start()};
  document.getElementById('reset').onclick=reset;
  presets.onclick=function(e){
    var b=e.target.closest('button');if(!b)return;
    [].forEach.call(presets.children,function(x){x.classList.remove('on')});
    b.classList.add('on');total=+b.dataset.s;reset();
  };
  var dlg=document.getElementById('dlg'),fh=document.getElementById('fh'),
      fm=document.getElementById('fm'),fs=document.getElementById('fs'),snd=document.getElementById('snd');
  function num(el,max){var v=parseInt(el.value,10);return isNaN(v)?0:Math.min(max,Math.max(0,v))}
  document.getElementById('cfg').onclick=function(){
    fh.value=Math.floor(total/3600);fm.value=Math.floor(total%3600/60);fs.value=total%60;
    snd.checked=soundOn;dlg.showModal();
  };
  document.getElementById('cancel').onclick=function(){dlg.close()};
  document.getElementById('apply').onclick=function(){
    var s=num(fh,99)*3600+num(fm,59)*60+num(fs,59);
    soundOn=snd.checked;
    if(s>0){
      total=s;
      [].forEach.call(presets.children,function(x){x.classList.toggle('on',+x.dataset.s===s)});
      reset();
    }
    dlg.close();
  };
  document.addEventListener('keydown',function(e){
    if(e.code==='Space'&&e.target.tagName!=='BUTTON'&&e.target.tagName!=='INPUT'&&!dlg.open){e.preventDefault();go.click()}
  });
})();
</script>
